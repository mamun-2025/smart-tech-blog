{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl font-bold mb-6 text-center">Latest Blog Posts</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for post in posts %}
    <div class="bg-white shadow-md p-5 rounded-lg border border-gray-200">
        <h2 class="text-xl font-bold mb-2">
            <a href="{% url 'post_detail' post.slug %}" class="text-blue-600 hover:underline">
                {{ post.title }}
            </a>
        </h2>
        <p class="text-gray-600 text-sm mb-4">By {{ post.author }} | {{ post.created_at|date:"M d, Y" }}</p>
        <p class="text-gray-700 leading-relaxed">{{ post.content|truncatewords:20 }}</p>
        <a href="{% url 'post_detail' post.slug %}" class="inline-block mt-4 text-sm font-semibold text-blue-500">Read More →</a>
    </div>
    {% empty %}
    <p class="text-center col-span-3">No posts available yet.</p>
    {% endfor %}
</div>
{% endblock %}
