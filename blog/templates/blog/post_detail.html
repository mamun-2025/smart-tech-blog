
{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 shadow rounded-lg">
   <h1 class="text-4xl font-bold mb-4">{{ post.title }}</h1>
   <div class="flex items-center text-gray-500 text-sm mb-6 border-b pb-4">
      <span>By <strong>{{ post.author }}</strong></span>
      <span class="mx-2">|</span>
      <span>{{ post.created_at|date:"F d, Y, g:i A" }}</span>
   </div>
   
   <div class="prose max-w-none text-gray-800 leading-loose">
      {{ post.content|linebreaks }}
   </div>

   <div class="mt-8">
      <a href="/" class="text-blue-500 hover:underline">← Back to Home</a>
   </div>

   {% if user == post.author %}
   <div class="mt-4 flex space-x-4 border-t pt-4">
         <a href="{% url 'post_update' post.slug %}" class="text-blue-600">Edit Post</a>
         <a href="{% url 'post_delete' post.slug %}" class="text-red-600">Delete Post</a>
   </div>
   {% endif %}
   


   
</div>
{% endblock %}
