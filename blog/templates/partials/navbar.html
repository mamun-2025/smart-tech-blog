
<nav class="bg-white shadow">
    <div class="container mx-auto flex justify-between items-center p-4">
        <a href="/" class="text-xl font-bold text-blue-600">MyBlog</a>

        <div class="space-x-4">
            {% if user.is_authenticated %}
                <a href="/post/create/" class="hover:text-blue-500">Create Post</a>
                <form action="{% url 'logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-red-500">Logout</button>
                </form>
            {% else %}
                <a href="/login/" class="hover:text-blue-500">Login</a>
                <a href="/signup/" class="bg-blue-500 text-white px-3 py-1 rounded">Signup</a>
            {% endif %}
        </div>
    </div>
</nav>
