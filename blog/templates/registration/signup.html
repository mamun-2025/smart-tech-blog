
{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 shadow-lg rounded-lg border border-gray-100">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Create Account</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="space-y-4 signup-form">
            {{ form.as_p }}
        </div>

        <button type="submit" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition duration-200">
            Sign Up
        </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
        Already have an account? 
        <a href="/login/" class="text-blue-500 hover:underline">Login here</a>
    </p>
</div>

<style>
    /* প্রতিটি প্যারাগ্রাফের (p) ভেতর লেবেল এবং ইনপুট থাকে */
    .signup-form p {
        display: flex;
        flex-direction: column;
        margin-bottom: 1rem;
    }

    .signup-form label {
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151; /* Gray-700 */
        margin-bottom: 0.25rem;
    }

    .signup-form input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db; /* Gray-300 */
        border-radius: 0.375rem; /* Rounded-md */
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .signup-form input:focus {
        border-color: #2563eb; /* Blue-600 */
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* পাসওয়ার্ডের হেল্প টেক্সট ছোট এবং হালকা করার জন্য */
    .signup-form .helptext {
        font-size: 0.75rem;
        color: #6b7280;
        margin-top: 0.25rem;
    }

    /* এরর মেসেজ দেখানোর জন্য */
    .signup-form .errorlist {
        color: #dc2626;
        font-size: 0.75rem;
        margin-bottom: 0.5rem;
    }
</style>
{% endblock %}
